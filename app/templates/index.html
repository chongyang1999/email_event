<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Email Timeline</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <h1>Email Timeline Tool</h1>

    <h2>Upload Email File</h2>
    <form method="POST" action="{{ url_for('upload_file') }}" enctype="multipart/form-data">
      <input type="file" name="email_files" accept=".eml,.mbox" multiple>
      <input type="submit" value="Upload Email(s)">
    </form>

    <hr>
    <h2>Email Timeline</h2>

    <div style="text-align: center; margin: 20px;">
        <button id="download-pdf-btn">Download Timeline as PDF</button>
        <button id="toggle-sort-btn" style="margin-left: 10px;">Sort: Newest First</button>
        <button id="download-html-btn" style="margin-left: 10px;">Download as HTML (.html)</button>
    </div>

    <fieldset id="ai-tools-section" style="margin-top: 20px; margin-bottom: 20px; padding: 10px; border: 1px solid #ccc;">
        <legend>AI Analysis Tools</legend>
        <div>
            <label for="gemini-api-key">Gemini API Key:</label>
            <input type="password" id="gemini-api-key" name="gemini-api-key" style="width: 300px; margin-left: 5px;" placeholder="Enter your Gemini API Key">
        </div>

        <div style="margin-top: 10px;">
            <label for="gemini-prompt">AI Prompt:</label><br>
            <textarea id="gemini-prompt" name="gemini-prompt" rows="5" style="width: 90%; margin-top: 5px;"></textarea>
        </div>

        <div style="margin-top: 10px;">
            <button id="analyze-emails-ai-btn">Analyze Emails with AI</button>
        </div>
    </fieldset>

    <div id="timeline-container">
        <p>Loading emails...</p>
    </div>

    <script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
